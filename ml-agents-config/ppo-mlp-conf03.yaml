behaviors:
  agent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    self_play:
      window: 10                       # Keeps the last 10 past versions of the policy to play against
      play_against_current_self_ratio: 0.5  # 50% chance to play latest version, 50% against historical past
      save_steps: 40000                # Save a snapshot of the current agent every 20,000 steps
      swap_steps: 10000                # Swap opponent policies every 10,000 steps
      team_change: 0                   # 0 for symmetric games (both agents have exact same abilities)
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 50000
