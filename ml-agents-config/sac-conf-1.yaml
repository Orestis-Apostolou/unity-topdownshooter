behaviors:
  YourAgentBehaviorName:
    trainer_type: sac    
    max_steps: 1000000         # Stop training after 1M steps. Increase for complex visual tasks
    time_horizon: 64           # How many steps of experience to collect per agent before adding to buffer
    summary_freq: 10000        # How often to write stats to TensorBoard (every 10k steps)
    keep_checkpoints: 5        # Max number of .onnx model checkpoints to keep
    checkpoint_interval: 50000 # Save a checkpoint model every 50k steps
    threaded: true

    hyperparameters:
      # Experience Replay Buffer (Crucial for SAC)
      buffer_size: 500000     # Size of memory bank. Keep large so SAC can reuse old visual memories
      buffer_init_steps: 5000 # Pre-fill the buffer with random action data before updating weights
      
      # Optimization
      batch_size: 256         # Batch size. Set 128-512 for continuous, 32-128 for discrete actions
      learning_rate: 3.0e-4   # Gradient descent step size
      learning_rate_schedule: constant # SAC learns best keeping this constant until convergence
      
      # Target Update & SAC Specifics
      tau: 0.005              # How aggressively target Q-networks track the trained twin Q-networks
      steps_per_update: 1     # How many environment steps between gradient updates
      save_replay_buffer: false # Save the huge replay buffer on exit (takes lots of disk space if true)
      
      # Entropy Tuning (Exploration)
      init_entcoef: 1.0       # Initial entropy weight. Start high (1.0) since your rewards are sparse

    # --- Neural Network Structure & CNN Selection ---
    network_settings:
      normalize: true             # Highly recommended for visual inputs to normalize pixel values
      hidden_units: 256           # Number of nodes in the dense policy layers
      num_layers: 2               # Number of dense layers after the CNN output
      vis_encode_type: nature_cnn # 3-layer CNN for Camera observations
      memory: null                # Can be configured with LSTM/GRU settings if agent needs recurrent memory

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        
      # Optional: Copy this section in if you want to help your agent explore sparse rewards
      # curiosity:
      #   strength: 0.02       # Intrinsic reward multiplier for visiting new visual states
      #   gamma: 0.99
      #   learning_rate: 3.0e-4