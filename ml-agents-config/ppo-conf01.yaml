behaviors:
  agent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      
      # The Exploration Control Loop
      beta: 0.015            # Start with a very aggressive exploration bonus
      beta_schedule: linear # Slowly decays the bonus to 0 by the end of max_steps
      epsilon: 0.2
      epsilon_schedule: linear
      num_epoch: 3
    network_settings:
      normalize: true       # Crucial when mixing grid tensors with vector observations
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      # Use Curiosity to keep the agent moving while rewards are sparse
      curiosity:
        strength: 0.01
        gamma: 0.99
        learning_rate: 3.0e-4
    max_steps: 5000000      # Give it a healthy 5 million steps to scale up
    time_horizon: 128       # Higher horizon helps connect sparse rewards across time
    summary_freq: 50000