behaviors:
  agent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.015
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.02
        gamma: 0.99
        learning_rate: 3.0e-4
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 50000